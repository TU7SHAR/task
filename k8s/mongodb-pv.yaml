# Persistent Volume (PV) for MongoDB data.
#
# This uses a `hostPath` volume, which stores data on the node's local disk.
# On a single-node Minikube cluster this is the simplest way to demonstrate
# persistence: the data survives pod restarts/rescheduling because it lives on
# the node at /mnt/data/mongodb, not inside the (ephemeral) container.
#
# We bind this PV to the PVC generated by the StatefulSet's volumeClaimTemplate
# by matching the storageClassName ("manual") and the requested capacity.
#
# ALTERNATIVE (see README Design Choices): on Minikube the default "standard"
# StorageClass can dynamically provision volumes, so an explicit PV is not
# strictly required. We define one here to satisfy the assignment's explicit
# "Configure a PV and PVC" requirement and to make the storage path explicit.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
  labels:
    app: mongodb
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/mongodb
