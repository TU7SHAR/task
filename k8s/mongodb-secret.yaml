# Secret holding the MongoDB root credentials.
#
# These values are consumed in two places:
#   1. The MongoDB StatefulSet, via MONGO_INITDB_ROOT_USERNAME / _PASSWORD,
#      which tells the official mongo image to create a root user on first
#      startup and enable authentication.
#   2. The Flask Deployment, which uses the same username/password to
#      authenticate when connecting.
#
# NOTE: `stringData` lets you provide plain-text values; Kubernetes base64-encodes
# them for you. For a real production system you would manage this Secret out of
# band (e.g. sealed-secrets, external secrets operator, Vault) and NOT commit it.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  labels:
    app: mongodb
type: Opaque
stringData:
  mongo-root-username: admin
  mongo-root-password: SuperSecret123
